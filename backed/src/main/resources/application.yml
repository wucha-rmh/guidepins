server:
  # 本机默认访问 http://localhost:8080；可在 .env 中覆盖端口。
  port: ${GUIDEPINS_SERVER_PORT:8080}
spring:
  config:
    # .env 按 Java Properties 格式读取；本地文件被 Git 忽略，系统环境变量仍可覆盖它。
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backed/.env[.properties]"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${GUIDEPINS_DB_URL:jdbc:postgresql://127.0.0.1:5433/guidepins}
    username: ${GUIDEPINS_DB_USER:guidepins_agent}
    password: ${GUIDEPINS_DB_PASSWORD:}
    hikari:
      read-only: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  # 业务读写 SQL 均放在对应模块的 Mapper XML 中。
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 对应 PostgreSQL 的 city_id、map_id、basemap_path 等下划线列名。
    map-underscore-to-camel-case: true
    # PostgreSQL 不使用 MyBatis 默认的 OTHER 类型绑定普通空值。
    jdbc-type-for-null: 'NULL'
  type-handlers-package: com.guidepins.config
  global-config:
    db-config:
      # BaseMapper 不自动生成 UUID；当前写接口在 XML 中省略主键并使用 RETURNING 回填。
      id-type: input
guidepins:
  auth:
    # 正式环境必须保持 true；本地 HTTP 调试在 .env 中显式设置 false。
    cookie-secure: ${GUIDEPINS_COOKIE_SECURE:true}
    session-cleanup-delay-ms: 3600000
  basemap:
    # 各地市制图产物根目录：每个地市一个「行政区代码-市名」文件夹，内含一份 *.pmtiles 与 boundary.geojson。
    root: ${GUIDEPINS_BASEMAP_ROOT:./map/江苏省地图数据/城市}
